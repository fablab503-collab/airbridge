name: Gimmich on devices

# Tries the Gimmich app on iPhone, iPad and Apple Watch simulators and on an Android phone and
# tablet emulator, and saves screenshots of each (immich-studio/device-tests/). A small demo server
# stands in for a real Gimmich/Immich. Runs only when started: Actions -> Gimmich on devices -> Run workflow.

on:
  workflow_dispatch:

jobs:
  apple:
    name: iPhone, iPad, Apple Watch
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Start the Gimmich demo server
        run: |
          nohup python3 immich-studio/device-tests/gimmich-demo-server.py immich-studio/studio/static 8080 \
            immich-studio/android/release > demo-server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:8080/studio/api/health && break; sleep 1; done

      - name: Open Gimmich on the simulators
        run: ./immich-studio/device-tests/gimmich-on-ios.sh gimmich-apple http://localhost:8080

      - name: Save screenshots
        if: always()
        run: cp demo-server.log gimmich-apple/ || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gimmich-iphone-ipad-watch
          path: gimmich-apple/

  android:
    name: Android ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: phone
            profile: pixel_7
          - label: tablet
            profile: pixel_tablet
    steps:
      - uses: actions/checkout@v4

      - name: Let the emulator use the processor's virtualisation
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Start the Gimmich demo server with a temporary https address
        # the Android app only accepts https:// addresses; a Cloudflare quick tunnel gives one for free
        run: |
          nohup python3 immich-studio/device-tests/gimmich-demo-server.py immich-studio/studio/static 8080 \
            immich-studio/android/release > demo-server.log 2>&1 &
          curl -fsSL -o cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x cloudflared
          nohup ./cloudflared tunnel --no-autoupdate --url http://localhost:8080 > tunnel.log 2>&1 &
          for i in $(seq 1 60); do
            url="$(grep -o 'https://[a-z0-9-]*\.trycloudflare\.com' tunnel.log | head -1)"
            [ -n "$url" ] && curl -sf "$url/studio/api/health" >/dev/null && break
            sleep 2
          done
          echo "Demo server: $url"
          echo "SERVER_URL=$url" >> "$GITHUB_ENV"
          echo "APK=$(ls immich-studio/android/release/*.apk | head -1)" >> "$GITHUB_ENV"

      - name: Try Gimmich on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: ${{ matrix.profile }}
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back emulated -camera-front emulated
          script: ./immich-studio/device-tests/gimmich-on-android.sh gimmich-android "Android ${{ matrix.label }}" "$APK" "$SERVER_URL"

      - name: Save screenshots
        if: always()
        run: |
          mkdir -p gimmich-android
          cp demo-server.log tunnel.log gimmich-android/ || true
          cat gimmich-android/results.txt || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gimmich-android-${{ matrix.label }}
          path: gimmich-android/
