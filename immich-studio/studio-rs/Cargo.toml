[package]
name = "studio-rs"
version = "0.1.0"
edition = "2021"
description = "Gimmich Studio in Rust: one program that runs every Studio tool on parallel threads"

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["fs"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "tiff", "ico", "tga", "pnm", "qoi", "hdr", "exr", "avif", "rayon"] }
rawler = "0.7"
libheif-rs = { version = "2", default-features = false, features = ["v1_17"] }
jxl-oxide = "0.12"
psd = "0.3"
webp = "0.3"
pdf-writer = "0.13"
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["load-dynamic", "ndarray"] }
ndarray = "0.16"
rayon = "1"
tempfile = "3"
resvg = "0.45"
futures-util = "0.3"
bytes = "1"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
