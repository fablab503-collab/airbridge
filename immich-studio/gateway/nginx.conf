# One address for everything:  /            -> Immich
#                               /studio/     -> Immich Studio (and /studio/graphite/ -> Graphite editor)
# It also adds Studio's button script to Immich's pages.
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
    listen 2283;
    client_max_body_size 50000M;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;

    location /studio/ {
        proxy_pass http://immich-studio:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://immich-server:2283;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # Needed so nginx can add the Studio script to Immich's HTML pages
        proxy_set_header Accept-Encoding "";
        sub_filter_once on;
        sub_filter_types text/html;
        sub_filter '</head>' '<script src="/studio/inject.js" defer></script></head>';
    }
}
